<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./index.html?mode=cac" />
  <title>Redirecting…</title>
</head>
<body>
  <p>Redirecting to the unified swipe deck…</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = new URL('./index.html', window.location.href);
    target.searchParams.set('mode', 'cac');
    if (params.has('file')) target.searchParams.set('file', params.get('file'));
    if (params.has('dir')) target.searchParams.set('dir', params.get('dir'));
    if (params.has('folder')) target.searchParams.set('folder', params.get('folder'));
    if (params.has('amount')) target.searchParams.set('amount', params.get('amount'));
    window.location.replace(target.href);
  </script>
</body>
</html>
