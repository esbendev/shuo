<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>转盘</title>
	<style>
		body {
			margin: 0;
			font-family: "Microsoft YaHei", sans-serif;
			background: #ffffff;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.wrap {
			width: 360px;
			text-align: center;
		}

		h1 {
			margin: 0 0 18px;
			color: #f16ca7;
			font-size: 40px;
			font-weight: 700;
			line-height: 1.2;
		}

		.wheel-box {
			position: relative;
			width: 320px;
			height: 320px;
			margin: 0 auto;
		}

		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		.pointer {
			position: absolute;
			top: -6px;
			left: 50%;
			transform: translateX(-50%);
			width: 0;
			height: 0;
			border-left: 12px solid transparent;
			border-right: 12px solid transparent;
			border-top: 20px solid #e2342d;
			z-index: 2;
		}

		.buttons {
			margin-top: 24px;
			display: flex;
			justify-content: center;
			gap: 22px;
		}

		button {
			border: none;
			background: #f26ab0;
			color: #fff;
			font-size: 28px;
			line-height: 1;
			border-radius: 12px;
			padding: 18px 28px;
			cursor: pointer;
		}

		button:active {
			transform: translateY(1px);
		}

		.popup-overlay {
			position: absolute;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.28);
			border-radius: 12px;
			z-index: 4;
		}

		.popup-overlay.show {
			display: flex;
		}

		.popup {
			width: 220px;
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
			padding: 16px 14px 14px;
			text-align: center;
		}

		.popup-title {
			font-size: 20px;
			color: #f26ab0;
			font-weight: 700;
			margin: 0 0 8px;
		}

		.popup-word {
			font-size: 36px;
			line-height: 1.1;
			color: #222;
			font-weight: 700;
			margin: 0 0 14px;
		}

		.popup-btn {
			border: none;
			background: #f26ab0;
			color: #fff;
			border-radius: 10px;
			font-size: 18px;
			padding: 10px 20px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<div class="wrap">
		<h1>来说一个句子吧</h1>

		<div class="wheel-box">
			<div class="pointer"></div>
			<canvas id="wheel" width="320" height="320"></canvas>
			<div id="popupOverlay" class="popup-overlay">
				<div class="popup">
					<p class="popup-title">选中的生词是:</p>
					<p id="popupWord" class="popup-word"></p>
					<button id="closePopupBtn" class="popup-btn">OK</button>
				</div>
			</div>
		</div>

		<div class="buttons">
			<button id="startBtn">开始</button>
			<button id="stopBtn">停止</button>
		</div>
	</div>

	<script>
		// Edit words here:
		// just add one word per line, no commas or anything else necesary.
		const WORDS_TEXT = `
			吃饭
			同学
			结婚
			报名
			搬家
			北京
			地方
			东西
			明白
			吹
			穿
			喜欢
			西瓜
			推
			跟
			学校
		`;

		const words = WORDS_TEXT
			.split("\n")
			.map(function (line) {
				return line.trim();
			})
			.filter(function (line) {
				return line.length > 0;
			});

		const colors = [
			"#f3dd67",
			"#c8f06c",
			"#95ea73",
			"#75e8a6",
			"#78dfe5",
			"#80c5ef",
			"#6ca4f1",
			"#6486ea",
			"#7b63df",
			"#a05be1",
			"#c762da",
			"#d968cc",
			"#eb6faf",
			"#f1778e",
			"#f08f61",
			"#e4b25c"
		];

		const canvas = document.getElementById("wheel");
		const ctx = canvas.getContext("2d");
		const startBtn = document.getElementById("startBtn");
		const stopBtn = document.getElementById("stopBtn");
		const popupOverlay = document.getElementById("popupOverlay");
		const popupWord = document.getElementById("popupWord");
		const closePopupBtn = document.getElementById("closePopupBtn");

		const size = canvas.width;
		const center = size / 2;
		const radius = size / 2 - 6;
		const step = (Math.PI * 2) / words.length;

		let angle = 0;
		let speed = 0;
		let spinning = false;
		let requestId = null;

		function drawWheel() {
			ctx.clearRect(0, 0, size, size);

			for (let i = 0; i < words.length; i++) {
				const start = angle + i * step;
				const end = start + step;

				ctx.beginPath();
				ctx.moveTo(center, center);
				ctx.arc(center, center, radius, start, end);
				ctx.closePath();
				ctx.fillStyle = colors[i % colors.length];
				ctx.fill();

				ctx.save();
				ctx.translate(center, center);
				ctx.rotate(start + step / 2);
				ctx.fillStyle = "#222";
				ctx.font = "20px Microsoft YaHei";
				ctx.textAlign = "right";
				ctx.textBaseline = "middle";
				ctx.fillText(words[i], radius - 14, 0);
				ctx.restore();
			}

			ctx.beginPath();
			ctx.arc(center, center, radius, 0, Math.PI * 2);
			ctx.strokeStyle = "#ffffff";
			ctx.lineWidth = 4;
			ctx.stroke();
		}

		function getResultWord() {
			const pointerAngle = -Math.PI / 2;
			const normalized = (pointerAngle - angle) % (Math.PI * 2);
			const fixed = (normalized + Math.PI * 2) % (Math.PI * 2);
			const index = Math.floor(fixed / step) % words.length;
			return words[index];
		}

		function animate() {
			angle += speed;
			drawWheel();

			if (!spinning && speed > 0) {
				speed *= 0.985;
				if (speed < 0.002) {
					speed = 0;
					cancelAnimationFrame(requestId);
					requestId = null;
					const word = getResultWord();
					popupWord.textContent = word;
					popupOverlay.classList.add("show");
					return;
				}
			}

			requestId = requestAnimationFrame(animate);
		}

		startBtn.addEventListener("click", function () {
			popupOverlay.classList.remove("show");
			spinning = true;
			speed = 0.25;
			if (!requestId) {
				requestId = requestAnimationFrame(animate);
			}
		});

		stopBtn.addEventListener("click", function () {
			if (!requestId) return;
			spinning = false;
		});

		closePopupBtn.addEventListener("click", function () {
			popupOverlay.classList.remove("show");
		});

		drawWheel();
	</script>
</body>
</html>
